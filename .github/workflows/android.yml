name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.13'

      - name: Offline-only guard
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'android.permission.INTERNET' app/src/main | grep -v 'Intentionally NO INTERNET'; then
            echo 'INTERNET permission is forbidden in this project.' >&2
            exit 1
          fi

      - name: Unit tests, lint and APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sms-strong-alert-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
