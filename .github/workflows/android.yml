name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Offline-only guard
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'android.permission.INTERNET' app/src/main | grep -v 'Intentionally NO INTERNET'; then
            echo 'INTERNET permission is forbidden in this project.' >&2
            exit 1
          fi

      - name: Unit tests, lint and APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-strong-alert-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
